apply plugin: 'java-library'
apply plugin: 'groovy'

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java', 'src/main/groovy'] }
    }
    test {
        groovy { srcDir 'src/test/groovy/' }
    }
}

dependencies {
    // XL dependencies
    implementation(project(':whelk-core'))

    // Groovy
    implementation "org.apache.groovy:groovy:${groovyVersion}"

    // Servlet
    api "jakarta.servlet:jakarta.servlet-api:${servletApiVersion}"
    implementation "org.eclipse.jetty:jetty-server:${jettyVersion}"
    implementation "org.eclipse.jetty.ee8:jetty-ee8-servlet:${jettyVersion}"

    implementation "org.apache.httpcomponents.client5:httpclient5:${httpComponentsClientVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "ch.qos.logback:logback-core:${logbackVersion}"

    // metrics
    implementation "io.prometheus:prometheus-metrics-core:${prometheusVersion}"
    implementation "io.prometheus:prometheus-metrics-exporter-servlet-javax:${prometheusVersion}"

    // Testing
    testImplementation "org.spockframework:spock-core:${spockVersion}"
}

test {
    useJUnitPlatform()
}

test.testLogging {
    showStandardStreams = true
    exceptionFormat = "full"
}
